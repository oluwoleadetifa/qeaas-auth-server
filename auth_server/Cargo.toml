[package]
name = "auth-server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1", features = ["full"] }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Use rustls to reduce system TLS dependency pain
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# liboqs wrapper (builds oqs-sys; needs cmake + build tools installed)
oqs = "0.10"

dotenvy = "0.15"
thiserror = "1.0"
anyhow = "1"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tower_governor = "0.6"
tower-http = { version = "0.5", features = ["limit", "trace"] }

async-trait = "0.1"
rand = "0.8"

hex = "0.4"
hkdf = "0.12"
sha2 = "0.10"
chacha20poly1305 = "0.10"
base64 = "0.22"